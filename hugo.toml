baseURL = 'https://kokkos.org/'
languageCode = 'en-us'
title = 'Kokkos'
disablePathToLower = true
enableEmoji = true
copyright = '© Kokkos Project a Series of LF Projects, LLC. For web site terms of use, trademark policy and other projects policies please see https://lfprojects.org.'

[markup.goldmark.renderer]
unsafe = true

# Hugo does not merge [build] settings from imported modules into the main site config, so
# Hinode's own buildStats.enable = true (needed to generate hugo_stats.json for PurgeCSS) must
# be set here too.
[build]
  [build.buildStats]
    enable = true

# Registry entries (content/community/applications/*) share one presentation, so it is set
# here instead of in every page's front matter. Front matter on a page still takes precedence.
[[cascade]]
  layout = 'minimal'
  [cascade.params]
    sharing = false
    metadata = 'none'
  [cascade.target]
    path = '/community/applications/**'

[taxonomies]
tag = 'tags'

[services.googleAnalytics]
id = 'G-TXYTG29JXM'

[privacy.googleAnalytics]
disable = false
respectDoNotTrack = false

[module]
  [module.hugoVersion]
    extended = true
    min = '0.136.3'

[[module.imports]]
path = 'github.com/gethinode/mod-blocks/v2'

[[module.imports]]
path = 'github.com/gethinode/hinode/v3'
