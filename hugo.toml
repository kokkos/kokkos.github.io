baseURL = 'https://kokkos.org/'
languageCode = 'en-us'
title = 'Kokkos'
disablePathToLower = true
enableEmoji = true
copyright = '© Kokkos Project a Series of LF Projects, LLC. For web site terms of use, trademark policy and other projects policies please see https://lfprojects.org.'

[markup.goldmark.renderer]
unsafe = true

# Hugo does not merge [build] settings from imported modules into the main site config, so
# Hinode's own buildStats.enable = true (needed to generate hugo_stats.json for PurgeCSS) must
# be set here too.
[build]
  [build.buildStats]
    enable = true

[taxonomies]
tag = 'tags'

[services.googleAnalytics]
id = 'G-TXYTG29JXM'

[privacy.googleAnalytics]
disable = false
respectDoNotTrack = false

[[module.imports]]
path = 'github.com/gethinode/mod-blocks/v2'

[[module.imports]]
path = 'github.com/gethinode/hinode/v3'
