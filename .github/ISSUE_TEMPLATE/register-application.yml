name: Register an application or library
description: Add your project to the list of applications and libraries leveraging Kokkos for performance portability.
title: "Register: "
labels:
  - application-registry
body:
  - type: markdown
    attributes:
      value: |
        Thanks for using Kokkos! This form adds your project to the
        [Applications](https://kokkos.org/community/applications/) page. See the
        [contribution guide](https://kokkos.org/community/applications/contributing/) for details on each field. A maintainer
        will open a pull request on your behalf from the information below.

        If you're comfortable with Git, you can also open a pull request directly
        using our [application PR template](https://github.com/kokkos/kokkos.github.io/compare?template=register-application.md)
        instead of filing this issue.

        Please provide at least one of the source repository, website, or
        documentation links below — they're shown as icons on your page.
        Private or proprietary codes can be listed too: choose "Restricted" under
        Availability, and the links become optional. Please use a team or
        project address as the contact if you prefer not to list a person.

        Feel free to attach a logo or screenshot to this issue (drag and drop an
        image into the text box below) — a maintainer will add it to your page.
  - type: dropdown
    id: entry-type
    attributes:
      label: Type
      description: Is this an application, or a library that others build on?
      options:
        - Application
        - Library
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: "Albany"
    validations:
      required: true
  - type: checkboxes
    id: area
    attributes:
      label: Area / domain
      description: Pick every field or problem domain that applies. Missing one? Say so in the notes field below.
      options:
        - label: Astrophysics
        - label: Benchmarks & Proxy Applications
        - label: Chemistry
        - label: Climate & Weather
        - label: Computational Fluid Dynamics
        - label: Data Analysis
        - label: Electromagnetics
        - label: Finite Elements
        - label: Geophysics & Earth Sciences
        - label: Linear Algebra & Solvers
        - label: Materials & Manufacturing
        - label: "Mesh, I/O & Load Balancing"
        - label: Molecular Dynamics
        - label: Multiphysics
        - label: Particle & Nuclear Physics
        - label: Particle Methods
        - label: Performance Tools
        - label: Plasma Physics & MHD
        - label: Programming Models Research
    validations:
      required: true
  - type: input
    id: institution
    attributes:
      label: Institution(s)
      description: Comma-separated if more than one institution collaborates on this project.
      placeholder: "Sandia National Laboratories, NREL"
    validations:
      required: true
  - type: dropdown
    id: availability
    attributes:
      label: Availability
      description: Can others inspect the code? "Restricted" covers private, proprietary and export-controlled projects.
      options:
        - Open source
        - Restricted
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source repository URL
      description: GitHub, GitLab, or Bitbucket URL. Shown as a source-code icon on your page.
      placeholder: "https://github.com/your-org/your-app"
    validations:
      required: false
  - type: input
    id: website
    attributes:
      label: Website URL (optional)
      description: Project homepage, if different from the source repository.
      placeholder: "https://your-project.org"
    validations:
      required: false
  - type: input
    id: documentation
    attributes:
      label: Documentation URL (optional)
      placeholder: "https://your-project.org/docs"
    validations:
      required: false
  - type: dropdown
    id: status
    attributes:
      label: Status
      description: How far along is your use of Kokkos? Pick the closest; add detail in the notes field below.
      options:
        - Evaluating
        - Porting
        - In production
    validations:
      required: true
  - type: input
    id: libraries
    attributes:
      label: Libraries used (optional)
      description: >
        Comma-separated list of libraries your application builds on top of.
        Allowed values: kokkos-comm, kokkos-fft, kokkos-kernels, kokkos-mdspan,
        kokkos-remote-spaces, kokkos-tools, eigen, petsc, trilinos. Mention
        others in the notes field. Shown as badges on your page.
      placeholder: "kokkos-kernels, kokkos-fft, petsc"
    validations:
      required: false
  - type: input
    id: contact-name
    attributes:
      label: Contact name(s)
      placeholder: "Jane Doe, John Smith"
    validations:
      required: true
  - type: input
    id: contact-email
    attributes:
      label: Contact email(s)
      placeholder: "jane.doe@example.org"
    validations:
      required: true
  - type: checkboxes
    id: approval
    attributes:
      label: Permission
      options:
        - label: I am allowed to list this project, its name and its institution publicly (for restricted or institutional codes, this includes any required release review). No classified information is included.
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Description / notes (optional)
      description: >
        Anything else you'd like on your application's page — a longer description,
        links to docs or papers, or clarification if you picked "Other" above.
    validations:
      required: false
